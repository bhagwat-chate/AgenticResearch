[build-system]
# Use modern setuptools for editable installs (PEP 660 support)
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "research-flow"
version = "0.1.0"
description = "Multi-Agent Research Automation Framework – Search, Analyze, Generate."
readme = "README.md"
requires-python = ">=3.11"

authors = [{ name = "Bhagwat Chate" }]
license = { text = "Proprietary" }

dependencies = [
    "ipykernel>=6.30.1",
    "langchain-community>=0.3.30",
    "langchain-core>=0.3.78",
    "langchain-google-genai==2.1.8",
    "langchain-groq==0.3.6",
    "langchain-openai==0.3.32",
    "langgraph>=0.6.8",
    "structlog==25.4.0",
    "tavily-python>=0.7.12",
    "wikipedia>=1.4.0",
]

[tool.setuptools.packages.find]
# Point setuptools to your actual package folder
where = ["."]
include = ["research_and_analyst*"]

# Optional – metadata and build settings
[tool.setuptools]
package-dir = { "" = "." }

[project.urls]
Homepage = "https://github.com/bhagwat-chate/research-flow"
Repository = "https://github.com/bhagwat-chate/research-flow"
